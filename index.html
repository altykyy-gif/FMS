<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منظومة الرسوم الدراسية - مراقبة التربية والتعليم سلوق</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d2e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-arabic-400-normal.woff2);unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2);unicode-range:U+0600-06FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
:root{--g:#0b3d2e;--g2:#15694f;--gold:#c9a227;--gl:#f3e6b3;--bg:#f2f0e6;--ink:#14261f;--red:#b3261e;--mut:#5d6f66}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;opacity:.14;pointer-events:none}
.bg svg{width:100%;height:100%}
header{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--gold)}
header img{width:54px;height:54px;border-radius:50%;background:#fff;padding:2px}
header h1{font-size:1.1rem;margin:0}header small{opacity:.85}
#inst{margin-inline-start:auto;display:none;background:var(--gold);color:#222;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;display:flex;box-shadow:0 -2px 12px #0003;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 1px;font-size:.66rem;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav a i{display:block;font-style:normal;font-size:1.3rem}
nav a{position:relative}.bd{position:absolute;top:2px;left:50%;margin-left:6px;background:var(--red);color:#fff;border-radius:10px;font-size:.65rem;font-style:normal;padding:0 5px}
nav a.on{color:var(--g);border-color:var(--gold);font-weight:700;background:#f7f3e0}
main{max-width:1050px;margin:auto;padding:14px}
h2{color:var(--g);margin:6px 0 12px}
.card{background:#fffffff2;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0b3d2e1a;border:1px solid #e3dcc0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;border-radius:14px;padding:12px;border-bottom:4px solid var(--gold)}
.st b{display:block;font-size:1.25rem;color:var(--gl)}
.bar{height:12px;background:#ddd;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e8c95a)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}
th{background:var(--g);color:#fff;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid #e6e0c8}
tr:nth-child(even) td{background:#faf7ea}
input,select{font:inherit;padding:8px;border:1px solid #c9c2a0;border-radius:8px;width:100%;background:#fff}
td input{min-width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:140px}
.b{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.b.go{background:var(--gold);color:#241c00}.b.rd{background:var(--red)}.b.sm{padding:4px 10px;font-size:.8rem}
.chip{display:inline-block;background:var(--gl);border-radius:20px;padding:6px 12px;margin:3px;cursor:pointer}
.al{display:flex;justify-content:space-between;gap:8px;padding:8px;border-right:4px solid var(--red);background:#fdeceb;border-radius:8px;margin:6px 0;flex-wrap:wrap}
.ok{color:var(--g2);font-weight:700}.no{color:var(--red);font-weight:700}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:30px;z-index:20;display:none;border:2px solid var(--gold)}
.ec{border-right:5px solid var(--gold)}.ec .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin:8px 0}.ec .kv div{background:#f6f2de;border-radius:8px;padding:6px 8px;font-size:.85rem}.ec .kv b{display:block}.chip a{cursor:pointer}.rc td{padding:5px 8px!important}.sheet table{font-size:.85rem}
.osg{margin:28px auto 0 0;width:240px;text-align:center;border-top:1px solid #333;padding-top:4px}
#pr{display:none}
.sheet{background:#fff;padding:18px;border:2px solid var(--g);border-radius:6px}
.rpt-h{display:flex;align-items:center;gap:14px;border-bottom:3px double var(--gold);padding-bottom:8px;margin-bottom:10px}
.rpt-h img{width:82px;height:82px}.rpt-h h3{margin:0;color:var(--g)}
.rc{border:2px solid var(--g);border-radius:8px;padding:10px 14px;height:132mm;position:relative;overflow:hidden;background:#fff}
.rc .rh{display:flex;align-items:center;gap:10px;border-bottom:3px double var(--gold);padding-bottom:6px;color:var(--g)}
.rc .rh img{width:70px;height:70px}.rc .no{margin-inline-start:auto;text-align:center;border:2px solid var(--g);border-radius:8px;padding:4px 10px;color:var(--g)}
.rc table{margin-top:8px;font-size:1rem}.rc td{border:1px solid #cfc7a0;background:#fff!important}.rc td:first-child{background:var(--gl)!important;width:32%;font-weight:700}
.rc .lab{position:absolute;left:10px;bottom:8px;font-size:.8rem;color:var(--mut)}
.sig{display:flex;justify-content:space-around;margin-top:30px;text-align:center}.sig div{border-top:1px solid #333;padding-top:4px;width:30%}
.cut{border-top:2px dashed #555;margin:6mm 0;text-align:center;color:#555;height:0;line-height:0}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff;padding:0}@page{size:A4;margin:8mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet{border:0}}
@media(min-width:800px){nav{position:static;box-shadow:0 2px 6px #0002}main{padding-top:20px}body{padding-bottom:0}}
</style>
</head>
<body>
<div class="bg"><svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#0b3d2e" stroke-width="3">
<g><path d="M20 500 L120 430 L200 460 L300 350 L400 380 L520 250 L640 290 L780 120" stroke="#c9a227" stroke-width="6"/>
<g fill="#15694f"><rect x="60" y="400" width="18" height="70"/><rect x="150" y="380" width="18" height="60"/><rect x="250" y="330" width="18" height="80"/><rect x="350" y="300" width="18" height="70"/><rect x="450" y="260" width="18" height="90"/><rect x="560" y="200" width="18" height="80"/><rect x="680" y="150" width="18" height="100"/></g>
<g fill="#c9a227" stroke="#8a6d10"><circle cx="90" cy="110" r="46"/><circle cx="170" cy="150" r="36"/><circle cx="700" cy="460" r="52"/><circle cx="620" cy="520" r="34"/><circle cx="330" cy="90" r="30"/></g>
<g fill="#0b3d2e" stroke="none" font-size="22" font-family="Cairo,Tahoma" text-anchor="middle"><text x="90" y="118">د.ل</text><text x="170" y="158" font-size="17">د.ل</text><text x="700" y="468">د.ل</text><text x="620" y="526" font-size="16">د.ل</text><text x="330" y="97" font-size="14">%</text></g>
<rect x="470" y="440" width="150" height="70" rx="8" fill="#e9dfb0" transform="rotate(-8 545 475)"/><rect x="40" y="250" width="130" height="60" rx="8" fill="#e9dfb0" transform="rotate(6 105 280)"/></g></svg></div>
<header><img src="logo.jpg" alt="الشعار"><div><h1>منظومة الرسوم الدراسية</h1><small id="hs">مراقبة التربية والتعليم - بلدية سلوق</small> <small style="opacity:.6">• إصدار 8</small></div><button id="inst">تثبيت التطبيق</button></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="toast"></div>
<div id="pr"></div>
<input type="file" id="fx" accept=".xlsx,.xls" hidden>
<input type="file" id="fb" accept=".json" hidden>
<script src="xlsx.min.js"></script>
<script>
const GR=["الأول ابتدائي","الثاني ابتدائي","الثالث ابتدائي","الرابع","الخامس","السادس","السابع","الثامن","التاسع","الأول ثانوي","الثاني ثانوي أدبي","الثاني ثانوي علمي","الثالث ثانوي أدبي","الثالث ثانوي علمي"];
const $=s=>document.querySelector(s);
const f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const D=n=>f(n)+' د.ل';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== IndexedDB ===== */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('salouq-fees',4);r.onupgradeneeded=()=>{const d=r.result,h=n=>d.objectStoreNames.contains(n);if(!h('kv'))d.createObjectStore('kv');['students','payments','teachers','tpay','fin'].forEach(n=>{if(!h(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})});if(!h('tlog'))d.createObjectStore('tlog',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function tx(s,m,fn){const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),o=t.objectStore(s);const q=fn(o);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})}
const all=s=>tx(s,'readonly',o=>o.getAll());
const put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k));
const del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
async function bulk(s,arr){const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,'readwrite'),o=t.objectStore(s);arr.forEach(v=>o.put(v));t.oncomplete=ok;t.onerror=()=>no(t.error)})}
const clr=s=>tx(s,'readwrite',o=>o.clear());
let S={cfg:{},st:[],pay:[],tc:[],tl:[],tp:[],fn:[],org:{}};
async function load(){S.cfg=(await tx('kv','readonly',o=>o.get('cfg')))||{};S.st=await all('students');S.pay=await all('payments');S.tc=await all('teachers');S.tl=await all('tlog');S.tp=await all('tpay');S.fn=await all('fin');S.org=(await tx('kv','readonly',o=>o.get('org')))||{}}
/* ===== حسابات ===== */
const byId=id=>S.st.find(s=>s.id==id);
const tot=s=>s.fee!=null&&s.fee!==''?+s.fee:+(S.cfg[s.grade]?.fee||0);
const paid=s=>S.pay.filter(p=>p.sid==s.id).reduce((a,p)=>a+p.amt,0);
const rem=s=>tot(s)-paid(s);
function expected(s){const c=S.cfg[s.grade]||{};const n=+c.n||1;if(!c.start)return 0;const a=new Date(c.start),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;const k=Math.max(0,Math.min(n,m+1));return tot(s)*k/n}
const late=s=>Math.max(0,expected(s)-paid(s));
/* ===== واجهة ===== */
let view='home';
const TABS=[['home','🏠','الرئيسية'],['grades','🏫','الصفوف'],['students','👨‍🎓','الطلاب'],['fees','💰','الرسوم'],['staff','👩‍🏫','المعلمون'],['fin','💼','المالية'],['reports','📊','التقارير']];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(v){view=v;applyOrg();$('#nav').innerHTML=TABS.map(t=>`<a class="${t[0]==v?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}${t[0]=='home'&&S.st.some(s=>late(s)>0.5)?`<em class="bd">${S.st.filter(s=>late(s)>0.5).length}</em>`:''}</a>`).join('');$('#v').innerHTML=({home:vHome,grades:vGrades,students:vStudents,fees:vFees,staff:vStaff,fin:vFin,reports:vReports})[v]();if(v=='fees')fr();if(v=='students')sl();if(v=='reports')rp();if(v=='staff')sfr();if(v=='fin')fnr();scrollTo(0,0)}
/* --- الرئيسية --- */
function vHome(){const T=S.st.reduce((a,s)=>a+tot(s),0),P=S.st.reduce((a,s)=>a+paid(s),0),pc=T?Math.round(P/T*100):0;
const L=S.st.map(s=>({s,l:late(s)})).filter(x=>x.l>0.5).sort((a,b)=>b.l-a.l);
return `<h2>لوحة المتابعة</h2><div class="grid"><div class="st">عدد الطلاب<b>${f(S.st.length)}</b></div><div class="st">إجمالي الرسوم<b>${D(T)}</b></div><div class="st">المحصّل<b>${D(P)}</b></div><div class="st">المتبقي<b>${D(T-P)}</b></div></div>
<div class="card" style="margin-top:14px">نسبة التحصيل ${pc}%<div class="bar"><i style="width:${pc}%"></i></div></div>
<div class="card"><h3>تنبيهات الأقساط المتأخرة (${L.length})</h3>${(g=>g.length?`<p class="no">⚠ لم يُحدَّد تاريخ أول قسط للصفوف: ${g.join('، ')} (من تبويب الصفوف)</p>`:'')(GR.filter(g=>S.cfg[g]?.fee&&!S.cfg[g]?.start&&S.st.some(s=>s.grade==g)))}${L.slice(0,15).map(x=>`<div class="al"><span><b>${esc(x.s.name)}</b> - ${x.s.grade}</span><span>متأخر: <b class="no">${D(x.l)}</b> ${x.s.phone?`<a href="tel:${esc(x.s.phone)}">📞</a>`:''} <button class="b sm" onclick="sel=${x.s.id};go('fees')">سداد</button></span></div>`).join('')||'<p class="ok">لا توجد أقساط متأخرة. حدّد عدد الأقساط وتاريخ أول قسط في تبويب الصفوف لتفعيل التنبيهات.</p>'}</div>
<div class="card"><h3>بيانات المؤسسة</h3><div class="row"><input id="on" placeholder="اسم المؤسسة / المدرسة" value="${esc(S.org.name)}"><input id="om" placeholder="اسم المسؤول" value="${esc(S.org.mgr)}"><input id="ot" list="otl" placeholder="صفته (مثال: مدير المدرسة)" value="${esc(S.org.title)}"><datalist id="otl"><option>مدير المدرسة<option>مراقب التربية والتعليم<option>رئيس اللجنة<option>المدير المالي</datalist><button class="b go" onclick="saveO()">حفظ</button></div><small>تظهر هذه البيانات في ترويسة وتوقيع كل التقارير والإيصالات.</small></div><div class="card"><h3>الأدوات</h3><div class="row"><button class="b go" onclick="notif()">🔔 تفعيل إشعارات الجهاز</button><button class="b" onclick="bk()">⬇ نسخة احتياطية</button><button class="b" onclick="$('#fb').click()">⬆ استعادة نسخة</button></div><small>البيانات محفوظة في ذاكرة المتصفح (IndexedDB) على هذا الجهاز. خذ نسخة احتياطية دورياً.</small></div>`}
async function notif(){if(!('Notification' in window))return toast('الجهاز لا يدعم الإشعارات');const r=await Notification.requestPermission();if(r=='granted'){toast('تم تفعيل الإشعارات');alertN()}}
async function alertN(){if(!('Notification' in window)||Notification.permission!='granted')return;const n=S.st.filter(s=>late(s)>0.5).length;if(!n)return;const r=await navigator.serviceWorker?.getRegistration();r?.showNotification('تنبيه أقساط',{body:`يوجد ${n} طالب متأخر عن سداد القسط`,icon:'icon-192.png',dir:'rtl',lang:'ar'})}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
const bk=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),`نسخة_احتياطية_${today()}.json`);
$('#fb').onchange=async e=>{const x=e.target.files[0];if(!x||!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;try{const d=JSON.parse(await x.text());await clr('students');await clr('payments');await clr('teachers');await clr('tlog');await clr('tpay');await clr('fin');await put('kv',d.cfg||{},'cfg');await put('kv',d.org||{},'org');await bulk('students',d.st||[]);await bulk('payments',d.pay||[]);await bulk('teachers',d.tc||[]);await bulk('tlog',d.tl||[]);await bulk('tpay',d.tp||[]);await bulk('fin',d.fn||[]);await load();go('home');toast('تمت الاستعادة')}catch{toast('ملف غير صالح')}e.target.value=''};
/* --- الصفوف --- */
function vGrades(){return `<h2>الصفوف وقيمة الرسوم</h2><div class="card"><div class="tw"><table><tr><th>الصف<th>القيمة (د.ل)<th>عدد الأقساط<th>تاريخ أول قسط<th>الطلاب</tr>${GR.map((g,i)=>{const c=S.cfg[g]||{};return `<tr><td><b>${g}</b><td><input type="number" min="0" data-g="${i}" data-k="fee" value="${c.fee||''}"><td><input type="number" min="1" data-g="${i}" data-k="n" value="${c.n||''}" placeholder="1"><td><input type="date" data-g="${i}" data-k="start" value="${c.start||''}"><td>${S.st.filter(s=>s.grade==g).length}</tr>`}).join('')}</table></div><div class="row"><button class="b" onclick="saveG()">💾 حفظ القيم</button></div></div>`}
async function saveG(){const c={};document.querySelectorAll('[data-g]').forEach(i=>{const g=GR[i.dataset.g];(c[g]=c[g]||{})[i.dataset.k]=i.value});S.cfg=c;await put('kv',c,'cfg');toast('تم الحفظ');go('grades')}
/* --- الطلاب --- */
const gOpts=(all)=>(all?'<option value="">كل الصفوف</option>':'')+GR.map(g=>`<option>${g}</option>`).join('');
function vStudents(){return `<h2>إضافة الطلاب</h2><div class="card"><h3>إضافة طالب</h3><div class="row"><input id="sn" placeholder="اسم الطالب"><input id="sp" placeholder="هاتف ولي الأمر"><select id="sg">${gOpts()}</select><button class="b go" onclick="addS()">إضافة</button></div></div>
<div class="card"><h3>الاستيراد من إكسل</h3><div class="row"><select id="xg">${gOpts(1)}</select><button class="b" onclick="tpl()">⬇ تحميل القالب</button><button class="b go" onclick="$('#fx').click()">⬆ رفع ملف الطلاب</button></div><small>اختر صفاً محدداً لرفع الملف إليه، أو "كل الصفوف" ليتم توزيع الأوراق حسب اسم الصف تلقائياً.</small></div>
<div class="card"><div class="row"><select id="fg" onchange="sl()">${gOpts(1)}</select><input id="fq" placeholder="بحث بالاسم" oninput="sl()"></div><div class="tw" id="sl"></div></div>`}
function sl(){const g=$('#fg').value,q=$('#fq').value.trim();const L=S.st.filter(s=>(!g||s.grade==g)&&(!q||s.name.includes(q)));$('#sl').innerHTML=`<table><tr><th>#<th>الاسم<th>الصف<th>الإجمالي<th>المدفوع<th>المتبقي<th></tr>${L.slice(0,200).map((s,i)=>`<tr><td>${i+1}<td>${esc(s.name)}<td>${s.grade}<td>${f(tot(s))}<td>${f(paid(s))}<td class="${rem(s)>0?'no':'ok'}">${f(rem(s))}<td style="white-space:nowrap"><button class="b sm go" onclick="sel=${s.id};go('fees')">دفع</button> <button class="b sm rd" onclick="delS(${s.id})">حذف</button></tr>`).join('')||'<tr><td colspan="7">لا يوجد طلاب</tr>'}</table>${L.length>200?`<small>يُعرض أول 200 من ${L.length}، استخدم البحث.</small>`:''}`}
async function addS(){const n=$('#sn').value.trim();if(!n)return toast('اكتب اسم الطالب');const s={name:n,phone:$('#sp').value.trim(),grade:$('#sg').value,fee:null};s.id=await put('students',s);S.st.push(s);$('#sn').value='';$('#sp').value='';toast('تمت الإضافة');sl()}
async function delS(id){if(!confirm('حذف الطالب وكل مدفوعاته؟'))return;await del('students',id);for(const p of S.pay.filter(p=>p.sid==id))await del('payments',p.id);S.st=S.st.filter(s=>s.id!=id);S.pay=S.pay.filter(p=>p.sid!=id);sl()}

<div class="grid"><div class="st">المستحق<b>${D(T('g'))}</b></div><div class="st">الخصومات<b>${D(T('d'))}</b></div><div class="st">الصافي<b>${D(T('n'))}</b></div><div class="st">المصروف<b>${D(T('pd'))}</b></div><div class="st">المتبقي<b>${D(T('r'))}</b></div></div><br>
${PR.map(r=>{const ps=S.tp.filter(p=>p.tid==r.t.id&&p.month==pm);return `<div class="card ec"><div class="row" style="align-items:center"><h3 style="margin:0">${esc(r.t.name)} <small>- ${TY[r.t.type]}</small></h3><span class="${r.r>0.5?'no':'ok'}" style="text-align:left">${r.r>0.5?'متبقي '+D(r.r):(r.n>0?'✔ مسدّد':'')}</span></div><div class="kv"><div>حضور<b>${r.dy.p}</b></div><div>غياب<b class="no">${r.dy.a}</b></div><div>إجازة<b>${r.dy.l}</b></div>${r.t.type=='t'?`<div>حصص منفذة<b>${r.v}</b></div>`:''}<div>المستحق<b>${f(r.g)}</b></div><div>الخصم<b class="no">${f(r.d)}</b></div><div>الصافي<b>${f(r.n)}</b></div><div>المصروف<b>${f(r.pd)}</b></div></div><button class="b go sm" onclick="spay(${r.t.id})">💵 صرف وطباعة إيصال</button>${ps.map(p=>` <span class="chip">${p.date}: ${f(p.amt)} <a onclick="tprt(${p.id})">🖨</a> <a onclick="tdel(${p.id})">✖</a></span>`).join('')}</div>`}).join('')||'<div class="card">أضف موظفين أولاً</div>'}`}
async function spay(id){const c=calc(S.tc.find(t=>t.id==id));if(c.n<=0)return toast('لا يوجد صافي مستحق لهذا الشهر');const a=+prompt('المبلغ المصروف (د.ل):',Math.max(0,c.r));if(!(a>0))return;const p={tid:id,month:pm,amt:a,date:today(),g:c.g,d:c.d,ab:c.ab,n:c.n,rem:c.r-a};p.id=await put('tpay',p);S.tp.push(p);sfr();tprt(p.id)}
async function tdel(id){if(!confirm('إلغاء عملية الصرف؟'))return;await del('tpay',id);S.tp=S.tp.filter(p=>p.id!=id);sfr()}
const trc=(p,t,lab)=>`<div class="rc"><div class="rh"><img src="logo.jpg"><div><b style="font-size:1.2rem">وزارة التربية والتعليم</b><br>مراقبة التربية والتعليم - بلدية سلوق${orgL()}</div><div class="no"><b>إيصال صرف مرتب</b><br>رقم: ${p.id}</div></div><table><tr><td>التاريخ<td>${p.date}<tr><td>الاسم<td>${esc(t.name)} (${TY[t.type]})<tr><td>عن شهر<td>${p.month}<tr><td>المستحق<td>${D(p.g)}<tr><td>الخصم (غياب: ${p.ab})<td>${D(p.d)}<tr><td>صافي المرتب<td>${D(p.n)}<tr><td>المبلغ المصروف<td><b style="font-size:1.2rem">${D(p.amt)}</b><tr><td>المتبقي<td><b>${D(p.rem)}</b></table><div class="sig"><div>توقيع المستلم</div>${sgM()}<div>الختم</div></div><span class="lab">${lab}</span></div>`;
function tprt(id){const p=S.tp.find(x=>x.id==id),t=S.tc.find(x=>x.id==p.tid);$('#pr').innerHTML=trc(p,t,'نسخة المستلم')+'<div class="cut">✂ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ ـ</div>'+trc(p,t,'نسخة المدرسة');setTimeout(()=>print(),150)}
function sx(){const ws=XLSX.utils.json_to_sheet(PR.map(r=>({'الاسم':r.t.name,'النوع':TY[r.t.type],'السعر':r.t.rate,'أيام الحضور':r.dy.p,'أيام الغياب':r.dy.a,'إجازة':r.dy.l,'حصص منفذة':r.v,'المستحق':r.g,'الخصم':r.d,'الصافي':r.n,'المصروف':r.pd,'المتبقي':r.r})));const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,pm);XLSX.writeFile(wb,`مرتبات_${pm}.xlsx`)}

/* ===== المالية ===== */
let fv='r',fy=new Date().getFullYear(),FH='',FY=[];
const CATS=['إيجار المبنى','كهرباء','مياه','إنترنت واتصالات','صيانة','مستلزمات ومطبوعات','نظافة وحراسة','أخرى'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mi=s=>+s.slice(0,4)*12+ +s.slice(5,7)-1;
function vFin(){return `<h2>المالية والالتزامات</h2><div class="card"><div class="row">${[['r','📈 تقرير السنة'],['e','🏢 الالتزامات والمصروفات'],['a','🗂 أرشيف السنوات']].map(x=>`<button class="b ${fv==x[0]?'go':''}" onclick="fv='${x[0]}';go('fin')">${x[1]}</button>`).join('')}</div></div><div id="fnx"></div>`}
function fnr(){$('#fnx').innerHTML=({r:fR,e:fE,a:fA})[fv]()}
function yr(y){const M=Array.from({length:12},()=>({rev:0,sal:0,obl:0,oth:0})),C={},ys=String(y);
S.pay.forEach(p=>{if(p.date.startsWith(ys))M[+p.date.slice(5,7)-1].rev+=p.amt});
S.tp.forEach(p=>{if(p.date.startsWith(ys)){M[+p.date.slice(5,7)-1].sal+=p.amt;C['رواتب وأجور']=(C['رواتب وأجور']||0)+p.amt}});
const cm=new Date().getFullYear()*12+new Date().getMonth();
S.fn.forEach(x=>{if(x.kind=='m'){const a=mi(x.from),b=x.to?Math.min(mi(x.to),cm):cm;for(let m=0;m<12;m++){const k=y*12+m;if(k>=a&&k<=b){M[m].obl+=x.amt;C[x.cat]=(C[x.cat]||0)+x.amt}}}else if(x.date.startsWith(ys)){M[+x.date.slice(5,7)-1].oth+=x.amt;C[x.cat]=(C[x.cat]||0)+x.amt}});
const R=M.reduce((a,m)=>a+m.rev,0),E=M.reduce((a,m)=>a+m.sal+m.obl+m.oth,0);return{y,M,C,R,E,N:R-E,S:M.reduce((a,m)=>a+m.sal,0)}}
function years(){const s=new Set([new Date().getFullYear()]);S.pay.forEach(p=>s.add(+p.date.slice(0,4)));S.tp.forEach(p=>s.add(+p.date.slice(0,4)));S.fn.forEach(x=>{const a=x.kind=='m'?+x.from.slice(0,4):+x.date.slice(0,4);for(let y=a;y<=new Date().getFullYear();y++)s.add(y)});return[...s].sort((a,b)=>b-a)}
function chart(M){const mx=Math.max(1,...M.map(m=>Math.max(m.rev,m.sal+m.obl+m.oth)));return `<svg viewBox="0 0 360 150" style="width:100%;max-width:640px"><line x1="5" y1="120" x2="355" y2="120" stroke="#999"/>${M.map((m,i)=>{const x=10+i*29,a=m.rev/mx*105,b=(m.sal+m.obl+m.oth)/mx*105;return `<rect x="${x}" y="${120-a}" width="12" height="${a}" fill="#15694f"/><rect x="${x+12}" y="${120-b}" width="12" height="${b}" fill="#c9a227"/><text x="${x+12}" y="132" font-size="9" text-anchor="middle">${i+1}</text>`}).join('')}<text x="350" y="146" font-size="9" fill="#15694f" text-anchor="end">■ الإيرادات</text><text x="270" y="146" font-size="9" fill="#a8861a" text-anchor="end">■ المصروفات</text></svg>`}
function fR(){const d=yr(fy);FY=d;const due=fy==new Date().getFullYear()?S.st.reduce((a,s)=>a+Math.max(0,rem(s)),0):0;
FH=`<div class="sheet"><div class="rpt-h"><img src="logo.jpg"><div><h3>وزارة التربية والتعليم</h3><b>مراقبة التربية والتعليم - بلدية سلوق</b>${orgL()}<br>التقرير المالي للمؤسسة - سنة ${fy}</div></div>
<div class="grid"><div class="st">الإيرادات (الرسوم المحصّلة)<b>${D(d.R)}</b></div><div class="st">المصروفات<b>${D(d.E)}</b></div><div class="st" style="${d.N<0?'background:var(--red)':''}">${d.N<0?'العجز':'صافي الربح'}<b>${D(Math.abs(d.N))}</b></div></div>
${due?`<p>رسوم طلاب لم تُحصَّل بعد (حتى اليوم): <b class="no">${D(due)}</b></p>`:''}<div style="text-align:center">${chart(d.M)}</div>
<h4 style="color:var(--g)">التفصيل الشهري</h4><div class="tw"><table><tr><th>الشهر<th>الإيرادات<th>الرواتب<th>الإيجار والالتزامات<th>مصروفات أخرى<th>الصافي</tr>${d.M.map((m,i)=>{const e=m.sal+m.obl+m.oth;return `<tr><td>${MN[i]}<td>${f(m.rev)}<td>${f(m.sal)}<td>${f(m.obl)}<td>${f(m.oth)}<td class="${m.rev-e<0?'no':'ok'}">${f(m.rev-e)}</tr>`}).join('')}<tr><th>الإجمالي<th>${f(d.R)}<th>${f(d.S)}<th>${f(d.M.reduce((a,m)=>a+m.obl,0))}<th>${f(d.M.reduce((a,m)=>a+m.oth,0))}<th>${f(d.N)}</tr></table></div>
<h4 style="color:var(--g)">المصروفات حسب البند</h4><table><tr><th>البند<th>القيمة<th>النسبة</tr>${Object.entries(d.C).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}<td>${f(v)}<td>${d.E?Math.round(v/d.E*100):0}%</tr>`).join('')||'<tr><td colspan="3">لا توجد مصروفات</tr>'}</table>${sgn()}</div>`;
return `<div class="card"><div class="row"><select onchange="fy=+this.value;fnr()">${years().map(y=>`<option ${y==fy?'selected':''}>${y}</option>`).join('')}</select><button class="b go" onclick="$('#pr').innerHTML=FH;print()">🖨 طباعة التقرير</button><button class="b" onclick="fx()">📗 Excel</button></div></div>${FH}`}
function fx(){const d=FY,ws=XLSX.utils.json_to_sheet(d.M.map((m,i)=>({'الشهر':MN[i],'الإيرادات':m.rev,'الرواتب':m.sal,'الإيجار والالتزامات':m.obl,'مصروفات أخرى':m.oth,'الصافي':m.rev-m.sal-m.obl-m.oth})));const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,String(d.y));XLSX.writeFile(wb,`تقرير_مالي_${d.y}.xlsx`)}
function fE(){const nowM=today().slice(0,7);return `<div class="card"><h3>إضافة التزام / مصروف</h3><div class="row"><select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="fa" type="number" min="0" placeholder="القيمة (د.ل)"><select id="fk" onchange="fkc()"><option value="m">التزام شهري متكرر (مثل الإيجار)</option><option value="o">مصروف مرة واحدة</option></select></div>
<div class="row"><input id="fn" placeholder="ملاحظة / تفاصيل (اختياري)"><label id="fdl">يبدأ من شهر<input id="fd" type="month" value="${nowM}"></label><label id="fel">ينتهي في (اختياري)<input id="fe" type="month"></label><button class="b go" onclick="fadd()">إضافة</button></div></div>
<div class="card"><div class="tw"><table><tr><th>البند<th>القيمة<th>النوع<th>الفترة<th></tr>${[...S.fn].sort((a,b)=>b.id-a.id).map(x=>`<tr><td><b>${esc(x.cat)}</b>${x.note?`<br><small>${esc(x.note)}</small>`:''}<td>${f(x.amt)}<td>${x.kind=='m'?'شهري':'مرة واحدة'}<td>${x.kind=='m'?`${x.from} ← ${x.to||'مستمر'}`:x.date}<td style="white-space:nowrap">${x.kind=='m'&&!x.to?`<button class="b sm" onclick="fstop(${x.id})">إيقاف</button> `:''}<button class="b sm rd" onclick="fdel(${x.id})">حذف</button></tr>`).join('')||'<tr><td colspan="5">أضف الإيجار وأي التزامات أخرى</tr>'}</table></div><small>الالتزام الشهري يُحتسب تلقائياً عن كل شهر من تاريخ بدايته حتى اليوم. الرواتب المصروفة تُحتسب تلقائياً من تبويب المعلمون.</small></div>`}
function fkc(){const m=$('#fk').value=='m';$('#fdl').firstChild.textContent=m?'يبدأ من شهر':'تاريخ الصرف';$('#fd').type=m?'month':'date';$('#fd').value=m?today().slice(0,7):today();$('#fel').style.display=m?'':'none'}
async function fadd(){const a=+$('#fa').value,k=$('#fk').value;if(!(a>0))return toast('أدخل القيمة');const x={cat:$('#fc').value,note:$('#fn').value.trim(),amt:a,kind:k};if(k=='m'){x.from=$('#fd').value||today().slice(0,7);x.to=$('#fe').value||''}else x.date=$('#fd').value||today();x.id=await put('fin',x);S.fn.push(x);toast('تمت الإضافة');fnr()}
async function fstop(id){const x=S.fn.find(v=>v.id==id);x.to=today().slice(0,7);await put('fin',x);fnr()}
async function fdel(id){if(!confirm('حذف هذا البند؟'))return;await del('fin',id);S.fn=S.fn.filter(x=>x.id!=id);fnr()}
function fA(){const L=years().map(yr);const T=k=>L.reduce((a,d)=>a+d[k],0);return `<div class="card"><div class="row"><button class="b" onclick="ax()">📗 تصدير الأرشيف Excel</button></div><div class="tw"><table><tr><th>السنة<th>الإيرادات<th>المصروفات<th>الصافي<th></tr>${L.map(d=>`<tr><td><b>${d.y}</b><td>${f(d.R)}<td>${f(d.E)}<td class="${d.N<0?'no':'ok'}">${f(d.N)}<td><button class="b sm go" onclick="fy=${d.y};fv='r';go('fin')">عرض التقرير</button></tr>`).join('')}<tr><th>الإجمالي<th>${f(T('R'))}<th>${f(T('E'))}<th>${f(T('N'))}<th></tr></table></div><small>كل سنة تُؤرشف تلقائياً حسب تاريخ العمليات، ولا حاجة لإغلاق السنة يدوياً. السنوات السابقة تبقى محفوظة وتُفتح بأي وقت.</small></div>`}
function ax(){const ws=XLSX.utils.json_to_sheet(years().map(yr).map(d=>({'السنة':d.y,'الإيرادات':d.R,'المصروفات':d.E,'الصافي':d.N})));const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'الأرشيف');XLSX.writeFile(wb,'أرشيف_السنوات.xlsx')}

const orgL=()=>S.org.name?`<br><b>${esc(S.org.name)}</b>`:'';
const sgn=()=>S.org.mgr?`<div class="osg">${esc(S.org.title||'المسؤول')}<br><b>${esc(S.org.mgr)}</b></div>`:'';
const sgM=()=>`<div>${S.org.mgr?esc(S.org.title||'المسؤول')+': '+esc(S.org.mgr):'توقيع المحاسب'}</div>`;
function applyOrg(){const e=$('#hs');if(e)e.textContent='مراقبة التربية والتعليم - بلدية سلوق'+(S.org.name?' • '+S.org.name:'')}
async function saveO(){S.org={name:$('#on').value.trim(),mgr:$('#om').value.trim(),title:$('#ot').value.trim()};await put('kv',S.org,'org');applyOrg();toast('تم حفظ بيانات المؤسسة')}
/* ===== تشغيل ===== */
(async()=>{navigator.storage?.persist?.();await load();go('home');alertN();document.addEventListener('visibilitychange',()=>{if(!document.hidden)alertN()});
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').style.display='block'});$('#inst').onclick=()=>dp?.prompt()})();
</script>
</body>
</html>
